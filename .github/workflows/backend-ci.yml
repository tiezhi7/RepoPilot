name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04

    # 仅影响 run 步骤；checkout 和 setup-python 仍按 Action 自身逻辑执行。
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12.16
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
          architecture: "x64"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Pin pip and show versions
        run: |
          set -euo pipefail
          .venv/bin/python --version
          .venv/bin/python -m pip install --only-binary=:all: --index-url https://pypi.org/simple pip==26.1.2
          .venv/bin/python -m pip --version

      - name: Install development dependencies
        run: |
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r locks/linux-py312-dev.txt

      - name: Check dependency compatibility
        run: .venv/bin/python -m pip check

      - name: Ruff code check
        run: .venv/bin/python -m ruff check .

      - name: Ruff format check
        run: .venv/bin/python -m ruff format --check .

      - name: Mypy type check
        run: .venv/bin/python -m mypy app

      - name: Tests and coverage
        run: .venv/bin/python -m pytest --cov=app --cov-report=term-missing -q
